# @jumo generated

[package]
name = "wist-gateway"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
jumo-derive = "0.1"
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
base64 = "0.22"
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service", "http1", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pki-types = "1"
rustls-webpki = "0.103"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
wist-contracts = { version = "0.1"}
wist-control = { version = "0.1" }
wist-error = { version = "0.1" }

#wist-contracts = { version = "0.1.1", path = "../wist-contracts" }
#wist-control = { version = "0.1.1", path = "../wist-control" }
#wist-error = { version = "0.1.1", path = "../wist-error" }
orion-error = { version = "0.8", features = ["derive", "serde_json"] }
ring = "0.17"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
