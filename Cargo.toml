# @jumo generated

[package]
name = "wist-gateway"
version = "0.1.3" #@gxl:set(version)
edition = "2024"
license = "Apache-2.0"

[dependencies]
jumo-derive = "0.1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "1.1"
base64 = "0.23"
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service", "http1", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pki-types = "1"
rustls-webpki = "0.103"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
wist-contracts = { version = "0.1" }
#wist-contracts = { version = "0.1.1", path = "../wist-contracts" }
wist-control = { version = "0.1" }
wist-error = { version = "0.1" }

#wist-control = { version = "0.1.1", path = "../wist-control" }
#wist-error = { version = "0.1.1", path = "../wist-error" }
orion-error = { version = "0.8", features = ["derive", "serde_json"] }
ring = "0.17"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 读安装包（wist-agentd-<version>-<triple>.tar.gz）顶层目录名，取 version/arch 落历史。
# flate2 默认走纯 Rust 后端（miniz_oxide），不引入 C 依赖。
flate2 = "1"
tar = "0.4"

# 持久化：SQLite（默认，内嵌）+ 同一 Store trait 下可选的 Postgres 实现。
# - sqlite-bundled：从源码编译 libsqlite3，构建期需要 C 编译器（release 流水线按架构原生构建，满足）。
#   这里不用 `sqlite` 聚合开关，是为了避免顺带启用 sqlite-load-extension。
# - macros + migrate：sqlx::migrate! 嵌入式迁移（两者缺一不可）。
# - chrono / json：TIMESTAMP 与 JSON 列的类型映射。
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite-bundled",
    "macros",
    "migrate",
    "chrono",
    "json",
] }
# 异步 trait：Store 需要 Arc<dyn Store> 持有，原生 async fn in trait 不可 dyn。
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
