[server]
listen_addr = "127.0.0.1:3000"
public_base_url = "https://127.0.0.1:3000"
tls_cert_file = "state/admin-tls.crt.pem"
tls_key_file = "state/admin-tls.key.pem"
admin_api_token = "${WARP_INSIGHT_ADMIN_TOKEN}"
victoria_metrics_url = "http://127.0.0.1:18429"

[agent]
package_file = "../../../wist-agentd/target/debug/wist-agentd"
bootstrap_token_ttl_seconds = 900
credential_ttl_seconds = 2592000
store_file = "state/wist-gateway-store.json"
trust_bundle = "internal-ca-stub"
install_script_signing_private_key_file = "state/install-script-signing-ed25519.pkcs8.pem"
tenant_id = "tenant-default"
environment_id = "env-default"

[store]
# 持久化 DSN。留空 → 使用上面 agent.store_file 同目录下的 wist-gateway.db（SQLite）。
# 可用环境变量 WIST_GATEWAY_DATABASE_URL 覆盖（显式置空 = 回到默认 SQLite 文件）。
# 本版本只实现了 SQLite：其它 scheme 会在启动时被拒。
database_url = ""

[purpose]
# 用途推断规则表（策展数据）。源头是 jumo 模型仓的
#   jumo/model/content/purpose-rules.toml
# 部署时拷过来并把路径写在这里（相对本配置文件）。
# 留空 = 不推断：Agent 报上来的事实摘要照常入库；**已有的建议保持不动**
# （页面仍能看到它的计算时刻），由人自行判断 —— 「不推断」不等于「清空」。
#
# 注意：**改了规则内容必须同时 bump rule_set_id**。网关靠 rule_set_id 判断建议是否
# 过期并在读取时重算；只改内容不改版本号，旧建议会被当成仍然有效。
rules_file = ""

[discovery]
# 发现方向策略表（策展数据）。源头是 jumo 模型仓的
#   jumo/model/content/aspect-policies.toml
# 部署时拷过来并把路径写在这里（相对本配置文件）。
# 留空 = 不下发（`POST /api/v1/agent/discovery-policies:poll` 回 503）：Agent 继续用
# 自己的内建默认值（与内容仓同值），行为与从前一致，不会因为「拿不到策略」而不采集。
#
# 注意：**改了策略内容必须同时 bump policy_version**。Agent 靠版本号判断手上那份
# 是不是同一版；只改值不改版本号，已经拉过表的 Agent 不会重读。
policies_file = ""
