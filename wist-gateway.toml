[server]
listen_addr = "127.0.0.1:3000"
# 对外基址：新装 Agent 的控制面 endpoint（安装命令 / 安装包也从它派生）。
# 同时是**数据面上送目标的域名来源**：管理面没设过「数据面上送地址」时，目标 =
# 本基址的主机名 + 数据面端口 9000（见 docs/design 里的上送授权设计）。
public_base_url = "https://127.0.0.1:3000"
tls_cert_file = "state/admin-tls.crt.pem"
tls_key_file = "state/admin-tls.key.pem"
admin_api_token = "${WARP_INSIGHT_ADMIN_TOKEN}"
victoria_metrics_url = "http://127.0.0.1:18429"

[agent]
bootstrap_token_ttl_seconds = 900
credential_ttl_seconds = 2592000
store_file = "state/wist-gateway-store.json"
trust_bundle_file = "state/admin-tls.crt.pem"
install_script_signing_private_key_file = "state/install-script-signing-ed25519.pkcs8.pem"
tenant_id = "tenant-default"
environment_id = "env-default"

# agent 客户端证书（mTLS）签发 CA：与「服务端叶证书的 CA」**分开**的一把 CA
# （见 docs/design/agent-identity-mtls.md §4.1）。两者同给同缺；都给才开 mTLS 签发。
# agent_ca_cert_file = "state/agent-ca.crt.pem"
# agent_ca_key_file = "state/agent-ca.key.pem"
# 签发的客户端证书有效期（秒）；缺省 37 天 = 保底 30 天 + 提前 7 天续期（§4.2）。
# client_cert_ttl_seconds = 3196800

[ingest]
# 数据面（wparse）内部接入端点：明文 HTTP，默认只绑环回；容器里要绑网卡（0.0.0.0）才连得上。
listen_addr = "127.0.0.1:3001"

# ── 可选段（默认都不装载；要启用就把文件放进配置目录并取消注释）──
# 源头是 jumo 模型仓的 jumo/model/content/*.toml；改了内容要同步 bump 相应版本号。
#
# [purpose]   rules_file    = "content/purpose-rules.toml"    # 用途推断规则表
# [discovery] policies_file = "content/aspect-policies.toml"  # 发现方向策略表
# [content]   catalog_file / packs_file / templates_file      # 内容目录三件套（要么都给、要么都不给）
#
# [store]     database_url  = ""                              # 持久化 DSN；留空 = 用 store_file 同级的 SQLite
